<!DOCTYPE html>
<html lang="th">

    input, button { padding: 10px; margin-top: 5px; width: 100%; box-sizing: border-box; }
    ul { list-style: none; padding: 0; }

  </style>
</head>
<body>
  <h2>บันทึกข้อมูลเข้า Firebase</h2>

  <h3>รายการข้อมูลในระบบ:</h3>
  <ul id="dataList"></ul>
